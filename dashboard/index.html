<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Fundworthy — this week's funding</title>

    <!-- The wordmark's F and dot, as a tab icon. Source of truth is logo/favicon.svg;
         this is the copy Vite serves, because everything in public/ is emitted to the
         root of dist/ untouched. Keep the two in step if the mark ever changes.

         SVG rather than .ico: it stays sharp on any display, and it is 459 bytes. The
         cost is that browsers older than Safari 16 ignore it and show their default —
         acceptable for a tool whose users are on current browsers, and the reason the
         mark is a filled badge rather than a transparent glyph, so it reads on a light
         or a dark tab strip either way. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Newsreader for display type and the big numerals, Albert Sans for everything
         else. Loaded from Google Fonts rather than self-hosted: the app already needs
         the network to read funder pages, and a vendored font directory is one more
         thing RISE would have to keep current. Both families fall back to system
         stacks in styles.css, so an offline machine gets a plainer page, not a broken
         one. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
