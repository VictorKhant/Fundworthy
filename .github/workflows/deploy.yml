# Push to main -> the VM updates itself.
#
# Two jobs, and the split is the point: the tests run on GitHub's machine, where a
# failure costs nothing, and the deploy only starts if they passed. A pipeline that
# deploys first and tests afterwards is a pipeline that tells you about the migration bug
# after it has run against a nonprofit's only copy of their data.
#
# The interesting work is in scripts/deploy.sh, on the VM, because it needs the database
# to decide whether deploying now is safe — a search is a 5-10 minute subprocess spending
# an org's own Anthropic credit, and a restart cuts it off. Keeping the logic there also
# means a human can run exactly the same deploy by hand when this file is the thing that
# is broken.
#
# Secrets to set (Settings -> Secrets and variables -> Actions):
#   VM_HOST         the hostname or IP of the box
#   VM_USER         usually `ubuntu`
#   VM_SSH_KEY      a private key created FOR THIS, not a person's own key
#   VM_KNOWN_HOSTS  output of `ssh-keyscan <host>`
#
# Until all four exist the deploy job stops with an explanation instead of running. It
# used to go ahead regardless: with the secrets unset the destination expanded to a bare
# `@`, ssh printed its usage and exited 255, and the first thing anyone saw of this
# pipeline was a red X with a wall of flags in it.

name: Deploy

on:
  push:
    branches: [main]
  # The tests have to run *before* the merge, not after it. Without this the sequence was:
  # merge, push to main, test, fail, roll back — the broken commit already on main and the
  # deploy reverting it on the VM. That happened, over a favicon. A pull_request run is
  # also the only way GitHub learns a check called `test` exists, which is what branch
  # protection's "require status checks" selects from.
  pull_request:
    branches: [main]
  # So a failed deploy can be retried, and so the first one can be run deliberately
  # rather than by pushing something.
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      # The dashboard has to be built before the suite, not after, and not at all is not
      # an option: `dist/` is gitignored, so without this step `DIST.exists()` is false,
      # app/main.py never registers the SPA catch-all, and every test of what the site
      # actually serves either fails (/welcome is a real 404) or quietly skips — which is
      # how the Search Console verification file could be deleted with a green tick.
      # scripts/deploy.sh builds before it tests for the same reason; this makes the two
      # run the same suite against the same thing.
      - run: cd dashboard && npm ci && npm run build
        env:
          # A placeholder, not the production hostname — this build is only ever tested,
          # never shipped (the VM builds its own from its .env). It has to be set to
          # something, because scripts/seo-urls.mjs deletes robots.txt and sitemap.xml
          # when it is empty, and the tests for those would then skip in CI.
          SITE_URL: https://fundworthy.example.org
      # Offline by construction — no API key, no network, nothing to spend.
      - run: python -m pytest tests/ -q

  deploy:
    needs: test
    # Never from a pull request. Both jobs run on every trigger, so without this the
    # moment PRs started the workflow every open branch would SSH into the production VM
    # and deploy itself over the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Moved down from the top of the file, where it covered every run. Two deploys at once
    # would race on the same working tree and the same service, so newer wins and the
    # older is cancelled rather than queued — but scoped to the whole workflow, opening a
    # pull request would join this group and cancel a production deploy already halfway
    # through on the box. On the job, only real deploys can cancel each other.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    steps:
      - name: Is deployment configured?
        id: check
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          missing=""
          [ -z "$VM_HOST" ]        && missing="$missing VM_HOST"
          [ -z "$VM_USER" ]        && missing="$missing VM_USER"
          [ -z "$VM_SSH_KEY" ]     && missing="$missing VM_SSH_KEY"
          [ -z "$VM_KNOWN_HOSTS" ] && missing="$missing VM_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "::notice::Auto-deploy is not set up yet. Missing secrets:$missing"
            echo "Add them under Settings -> Secrets and variables -> Actions."
            echo "docs/UPGRADE.md section 8 has the commands. The tests above still ran."
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Authorise the SSH key
        if: steps.check.outputs.ready == 'yes'
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, not StrictHostKeyChecking=no. Disabling the check is the
          # usual shortcut in deploy workflows and it means this job will happily hand
          # its key to whatever answers on that address.
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        if: steps.check.outputs.ready == 'yes'
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          # The deploy script is refreshed from the branch before it runs, so a fix to
          # the deploy procedure itself takes effect on the next deploy rather than the
          # one after it.
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "$VM_USER@$VM_HOST" \
            'set -e
             cd ~/Rise-Fund-Finder
             git fetch origin main
             git checkout origin/main -- scripts/deploy.sh
             chmod +x scripts/deploy.sh
             ./scripts/deploy.sh'
