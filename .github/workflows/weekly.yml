# Weekly funding run for RISE San Diego. (CLAUDE.md §4, §9, §12 Block 3)
#
# Wednesday 11pm PT -> the brief is sitting in the Sheet when Mauri opens it
# Thursday morning, before her Thursday meeting.
#
# ─── KNOWN GAP, v2 ──────────────────────────────────────────────────────────────
# This scheduled run and the local dashboard now read config from DIFFERENT PLACES,
# and neither one can see the other's settings.
#
#   local app  ->  data/rise.db   (what Mauri edits; gitignored, and it holds her
#                                  encrypted API key, so it must never be committed)
#   this job   ->  the Google Sheet Config tab  (agent/config.py's fallback path)
#
# So a floor she changes on the dashboard does NOT change what runs here. That is a
# real limitation, not an oversight, and it is the reason this workflow has never been
# switched on: the local app is the product for v2, and turning this on as well would
# mean two agents with two different ideas of what Mauri wants.
#
# Whoever picks this up has three honest options, in rough order of effort:
#   1. Leave it off. The dashboard's Re-run button covers the weekly job.
#   2. Keep the Sheet Config tab as the single source for BOTH — agent/config.py
#      already reads it; the dashboard would need to write to it.
#   3. Deploy the app (see HANDOFF.md "If you deploy it") and drop the cron entirely.
#
# Until one of those is chosen, this file stays as documented, working, and inactive.
# ────────────────────────────────────────────────────────────────────────────────
#
# Mauri never touches this file. Her controls are the Config tab of the Sheet:
# set ENABLED to FALSE and the run below exits at step 0, before any network call.

name: Weekly funding run

on:
  schedule:
    # 06:00 UTC Thursday.
    #
    # GitHub Actions cron is UTC and does not observe daylight saving, so this
    # lands at 23:00 Wed PDT (Mar-Nov) and 22:00 Wed PST (Nov-Mar). Chosen
    # deliberately over 07:00 UTC: 06:00 is at worst an hour EARLY and always
    # still Wednesday night, whereas 07:00 UTC would tip into Thursday 00:00
    # during PDT. Early is harmless; late risks missing her Thursday morning.
    - cron: "0 6 * * 4"

  # Lets RISE run it on demand — for a demo, or to re-run after fixing something.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Crawl and report, but write nothing to the Sheet"
        type: boolean
        default: false
      no_llm:
        description: "Free tiers only (no scoring, $0.00)"
        type: boolean
        default: false
      budget:
        description: "Spend ceiling in USD for this run"
        default: "1.00"

# One run at a time. Two overlapping runs would double-spend the budget and
# interleave rows in the Sheet.
concurrency:
  group: rise-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # §3: no unbounded loop. A hung fetch cannot burn an Actions quota all night.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write the service-account credentials
        env:
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: |
          if [ -z "$GOOGLE_SHEETS_CREDENTIALS" ]; then
            echo "::error::GOOGLE_SHEETS_CREDENTIALS is not set. Add the service-account JSON as a repository secret."
            exit 1
          fi
          # Written via the env var, never echoed and never an argv value.
          printf '%s' "$GOOGLE_SHEETS_CREDENTIALS" > "$RUNNER_TEMP/service-account.json"
          chmod 600 "$RUNNER_TEMP/service-account.json"
          python -c "import json,os;json.load(open(os.environ['RUNNER_TEMP']+'/service-account.json'))" \
            || { echo "::error::GOOGLE_SHEETS_CREDENTIALS is not valid JSON."; exit 1; }

      - name: Run the agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RISE_SHEET_ID: ${{ secrets.RISE_SHEET_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/service-account.json
          # Refuse to run if the Config tab is unreadable — otherwise a Sheets
          # outage would silently default ENABLED to true and ignore Mauri's
          # kill switch. See agent/config.py.
          RISE_STRICT_CONFIG: "1"
        run: |
          ARGS="--sink sheets --out out"
          [ "${{ inputs.dry_run }}" = "true" ] && ARGS="$ARGS --dry-run"
          [ "${{ inputs.no_llm }}"  = "true" ] && ARGS="$ARGS --no-llm"
          [ -n "${{ inputs.budget }}" ] && ARGS="$ARGS --budget ${{ inputs.budget }}"
          echo "python -m agent.run $ARGS"
          python -m agent.run $ARGS

      - name: Remove the credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/service-account.json"

      # The run log is the evidence package's raw material (§12 rubric,
      # "Evidence package"). Kept even when the run fails — a failed run is
      # exactly the one worth reading.
      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_number }}
          path: out/
          if-no-files-found: ignore
          retention-days: 90
